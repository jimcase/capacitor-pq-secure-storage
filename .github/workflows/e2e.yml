name: E2E

# Slow (builds WebDriverAgent, boots a simulator), and iOS needs an Xcode 26 runner for the
# iOS 26 SDK, so this is manual-trigger only, not on every push/PR.
on:
  workflow_dispatch:

permissions: {}

jobs:
  ios:
    name: iOS e2e (simulator, core specs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # needs Xcode 26 for the iOS 26 SDK; point DEVELOPER_DIR at it once the runner ships it
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: lts/*
          cache: npm
      # build the plugin dist/ so the test-app's file:.. dependency resolves
      - run: npm ci
      - run: npm run build
      - name: Test-app install + web build
        working-directory: test-app
        run: |
          npm install
          npm run build
      - name: Add iOS platform and build the app
        working-directory: test-app
        run: |
          npx cap add ios
          # the plugin floor is iOS 15; Capacitor generates 14
          sed -i '' "s/platform :ios, '14.0'/platform :ios, '15.0'/" ios/App/Podfile
          (cd ios/App && pod install)
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator \
            -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Install Appium xcuitest driver
        working-directory: test-app
        run: npx appium driver install xcuitest
      - name: Pick an available iOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | test("iPhone")))][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run e2e (core specs; hardware specs skip on the simulator)
        working-directory: test-app
        env:
          IOS_APP_PATH: ${{ github.workspace }}/test-app/ios/build/Build/Products/Debug-iphonesimulator/App.app
          IOS_UDID: ${{ steps.sim.outputs.udid }}
        run: npm run e2e:ios

  android:
    name: Android e2e (emulator, core specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: lts/*
          cache: npm
      # build the plugin dist/ so the test-app's file:.. dependency resolves
      - run: npm ci
      - run: npm run build
      # capacitor-android 7.x compiles with source release 21
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Test-app install + web build
        working-directory: test-app
        run: |
          npm install
          npm run build
      - name: Add Android platform and build the APK
        working-directory: test-app
        run: |
          npx cap add android
          cd android && ./gradlew assembleDebug
      - name: Install Appium uiautomator2 driver
        working-directory: test-app
        run: npx appium driver install uiautomator2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # boots the emulator, then runs the e2e inside `script` while it is up. ANDROID_AVD is left
      # unset so Appium attaches to the already-running emulator instead of booting its own.
      - name: Run e2e on emulator (core specs)
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: |
            cd test-app
            ANDROID_APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk npm run e2e:android
