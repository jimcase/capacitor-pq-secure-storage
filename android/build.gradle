buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply from: 'variables.gradle'

android {
    namespace "com.capacitorpqsecurestorage"

    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        // ship the keep rules to the consuming app: its R8 must not strip BouncyCastle
        consumerProguardFiles 'proguard-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    // BiometricPrompt + CryptoObject binding for sign() -- confirm 1.1.0 vs 1.2.0-alpha on-device
    implementation 'androidx.biometric:biometric:1.1.0'
    // ML-KEM in software (AndroidKeyStore does not expose ML-KEM to apps, only ML-DSA). The
    // private key is wrapped by a Keystore AES key (TEE). ML-KEM naming (org.bouncycastle.jcajce
    // .spec.MLKEMParameterSpec, algorithm "ML-KEM") landed in BC 1.80; 1.78 only had Kyber.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
}
